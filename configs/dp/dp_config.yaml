# config for Differential Privacy

# mech_to_use: 'laplace'
# mech_to_use: 'laplace_year'
# mech_to_use: 'laplace_day'
mech_to_use: 'optstream'

laplace:
    mean: 0.0
    sensitivity: 0.01
    epsilon: 0.2

laplace_year:
    sensitivity: 's_max' #'s_mean' 'mean'
    mean: 0.0
    epsilon: 40.0

laplace_day:
    # sensitivity_def: 's_max' #'s_mean' 'mean'
    sensitivity: 's_max' #'s_mean' #'mean' # 's_max'
    mean: 0.0
    epsilon: 0.2

optstream:
    w: 96
    # Sampling
    sampling: 'equal' #equal spaced points sampling
    k: 48

    # Perturbation
    perturb: True
    sensitivity: 'app' #'s_max' #'s_mean' #'mean' # 's_max'
    mean: 0.0
    epsilon: 500.0
    # Reconstruction
    reconstruct: True
    method: 'linear'
    # post process
    post_process: True
